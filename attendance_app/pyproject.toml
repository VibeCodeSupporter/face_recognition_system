[project]
name = "attendance-app"
version = "0.1.0"
description = "PyQt edge application for face attendance and access control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "onnxruntime-gpu==1.23.2; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "onnxruntime==1.23.2; (sys_platform != 'win32' or platform_machine != 'AMD64') and (sys_platform != 'linux' or platform_machine != 'x86_64')",
    "faiss-cpu==1.15.1",
    "python-dotenv>=1.2.4",
    "trackers>=2.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

